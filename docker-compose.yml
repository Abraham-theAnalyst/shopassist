services:
  api:
    build:
      context: .
      target: production
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Runs the test suite: docker compose run --rm --build tests
  # The "test" profile keeps it from starting with a plain "docker compose up".
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    env_file: .env
    environment:
      # Blank the real key, so even a bug in the tests can't reach OpenRouter
      OPENROUTER_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
